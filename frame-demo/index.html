<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instant frame · Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171717;color:#eee;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{max-width:1180px;margin:0 auto;padding:40px 24px 24px}h1{font-size:26px;font-weight:600;letter-spacing:-.8px;margin:0 0 8px}p{color:#999;font-size:14px;margin:0;line-height:1.5}.board{display:flex;justify-content:center;align-items:center;gap:36px;padding:28px 24px 64px;flex-wrap:wrap}.item{width:350px}h2{font-size:14px;font-weight:500;color:#aaa;margin:24px 0 8px;text-align:center}.paper{position:relative;padding:21px 21px 70px;background:#f5f3ee;border-radius:3px;box-shadow:0 1px 1px #ffffff60 inset,0 -1px 2px #0003 inset,0 2px 3px #0004,0 14px 30px #0005;isolation:isolate}.paper::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.07;background-image:url("paper.svg");border-radius:inherit}.window{position:relative;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px #0002,0 1px 2px #0006 inset;background:#252421}.window::after{content:"";position:absolute;inset:0;box-shadow:0 1px 3px #0005 inset;pointer-events:none;border-radius:inherit}.window img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.8) sepia(.12) contrast(.96)}.landscape .window{aspect-ratio:99/62}.square .window{aspect-ratio:1}.portrait .window{aspect-ratio:23/31}footer{text-align:center;color:#888;font-size:13px;padding:0 24px 36px}button{font:inherit;background:#ffffff12;border:1px solid #ffffff25;color:inherit;padding:9px 15px;border-radius:22px;cursor:pointer;margin-top:18px}body.light{background:#e5e2dc;color:#252521}body.light p,body.light h2,body.light footer{color:#706b65}body.light button{border-color:#0002;background:#fff5}.item p{text-align:center;font-size:12px}@media(max-width:400px){.item{width:calc(100vw - 48px)}.paper{padding:6% 6% 20%}}
</style>
<header><h1>A little moment, on paper.</h1><p>Giấy trắng ngà · Viền đáy dày · Ba tỉ lệ ảnh</p><button id="bg" onclick="document.body.classList.toggle('light');this.textContent=document.body.classList.contains('light')?'Xem trên nền tối':'Xem trên nền sáng'">Xem trên nền sáng</button></header>
<main class="board">
<section class="item landscape"><div class="paper"><div class="window"><img src="../ios/PolaroidVibe/Resources/sample.jpg" alt="Ảnh hồ trong khung ngang"></div></div><h2>Ngang</h2><p>Khung 350 × 284 · Ảnh 99:62</p></section>
<section class="item square"><div class="paper"><div class="window"><img src="../ios/PolaroidVibe/Resources/sample.jpg" alt="Ảnh hồ trong khung vuông"></div></div><h2>Vuông</h2><p>Khung 350 × 399 · Ảnh 1:1</p></section>
<section class="item portrait"><div class="paper"><div class="window"><img src="../ios/PolaroidVibe/Resources/sample.jpg" alt="Ảnh hồ trong khung dọc"></div></div><h2>Dọc</h2><p>Khung 350 × 506 · Ảnh 23:31</p></section>
</main><footer>Demo khung giấy — viền đáy để trống cho design màn kết quả.</footer></html>
